<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบการลงนัดการประชุมรับฟังการนำเสนอผลงานของพนักงานตำแหน่งหัวหน้าแผนก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
        }
        input[type="date"]:invalid::-webkit-datetime-edit {
            color: #9ca3af;
        }
        input[type="date"]:valid::-webkit-datetime-edit {
            color: #1f2937;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4 flex flex-col justify-between">
    <div class="max-w-4xl mx-auto w-full flex-1">
        <!-- หัวข้อเว็บ -->
        <header class="text-center mb-10">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-600">📊 ระบบการลงนัดการประชุมรับฟังการนำเสนอผลงานของพนักงานตำแหน่งหัวหน้าแผนก</h1>
            <p class="text-gray-500 mt-2">ช่วงเวลาระหว่างวันที่ <span class="font-semibold text-blue-600">19 - 23 ตุลาคม 2569</span></p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- ฟอร์มกรอกข้อมูลการจอง -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">✍️ ฟอร์มจองเวลาประชุม</h2>
                <form id="bookingForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                        <input type="text" id="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="ระบุชื่อของท่าน">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ตำแหน่ง</label>
                        <input type="text" id="position" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="ระบุตำแหน่งของท่าน">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">วันที่</label>
                            <input type="date" id="date" min="2026-10-19" max="2026-10-23" required data-placeholder="เลือกวันที่" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ช่วงเวลา</label>
                            <select id="time" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                                <option value="" disabled selected>-- เลือกช่วงเวลา --</option>
                                <option value="08:30-09:00">08:30 - 09:00 น.</option>
                                <option value="09:30-10:00">09:30 - 10:00 น.</option>
                                <option value="10:00-10:30">10:00 - 10:30 น.</option>
                                <option value="10:30-11:00">10:30 - 11:00 น.</option>
                                <option value="11:00-11:30">11:00 - 11:30 น.</option>
                                <option value="13:00-13:30">13:00 - 13:30 น.</option>
                                <option value="13:30-14:00">13:30 - 14:00 น.</option>
                                <option value="14:00-14:30">14:00 - 14:30 น.</option>
                                <option value="14:30-15:00">14:30 - 15:00 น.</option>
                                <option value="15:00-15:30">15:00 - 15:30 น.</option>
                                <option value="15:30-16:00">15:30 - 16:00 น.</option>
                                <option value="16:00-16:30">16:00 - 16:30 น.</option>
                                <option value="16:30-17:00">16:30 - 17:00 น.</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                        ยืนยันการจอง
                    </button>
                </form>
            </div>

            <!-- ส่วนแสดงรายการนัดหมาย -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-800">📋 รายการนัดหมายทั้งหมด</h2>
                    <button id="clearAll" class="text-xs text-red-500 hover:text-red-700 underline">ล้างข้อมูลทั้งหมด</button>
                </div>
                <div id="bookingList" class="space-y-3 overflow-y-auto max-h-[380px] pr-1 flex-1">
                    <p id="emptyMessage" class="text-gray-400 text-center py-10">ยังไม่มีรายการนัดหมายในขณะนี้</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ส่วนข้อความติดต่อสอบถามด้านล่างสุด -->
    <footer class="mt-12 text-center text-sm text-gray-500 border-t border-gray-200 pt-6">
        <p>หากมีข้อสงสัยโปรดติดต่อ <span class="font-medium text-gray-700">แผนกประเมินผลบุคลากร กองบริหารทรัพยากรบุคคล ฝ่ายทรัพยากรบุคคล</span> โทร. <span class="font-semibold text-blue-600">1232 1231</span></p>
    </footer>

    <!-- ส่วน Script ควบคุมการทำงาน -->
    <script>
        const bookingForm = document.getElementById('bookingForm');
        const bookingList = document.getElementById('bookingList');
        const clearAllBtn = document.getElementById('clearAll');
        const dateInput = document.getElementById('date');

        // จัดการแสดงผล placeholder ของ input date
        dateInput.addEventListener('input', function() {
            if (!this.value) {
                this.classList.add('text-gray-400');
            } else {
                this.classList.remove('text-gray-400');
            }
        });
        dateInput.classList.add('text-gray-400');

        let bookings = JSON.parse(localStorage.getItem('meetings_presentation_oct_v5')) || [];

        // ฟังก์ชันแปลงวันที่ให้เป็นรูปแบบ "วัน เดือน ปี" ภาษาไทย
        function formatDateThai(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const date = new Date(dateString + 'T00:00:00');
            return date.toLocaleDateString('th-TH', options);
        }

        function renderBookings() {
            bookingList.innerHTML = '';
            
            if (bookings.length === 0) {
                bookingList.innerHTML = `<p class="text-gray-400 text-center py-10">ยังไม่มีรายการนัดหมายในขณะนี้</p>`;
                return;
            }

            bookings.forEach((booking, index) => {
                const formattedDate = formatDateThai(booking.date);
                const card = document.createElement('div');
                card.className = "bg-gray-50 border border-gray-200 p-4 rounded-xl flex justify-between items-start transition hover:shadow-sm";
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-gray-800 text-base">👤 ${escapeHtml(booking.name)}</h3>
                        <p class="text-sm text-blue-600 font-medium mt-0.5">📌 ตำแหน่ง: ${escapeHtml(booking.position)}</p>
                        <p class="text-xs text-gray-500 mt-1">📅 ${formattedDate} ⏰ ${booking.time} น.</p>
                    </div>
                    <button onclick="deleteBooking(${index})" class="text-red-500 hover:text-red-700 text-sm font-semibold p-1">
                        ✕
                    </button>
                `;
                bookingList.appendChild(card);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        bookingForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const position = document.getElementById('position').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;

            const newBooking = { name, position, date, time };
            bookings.push(newBooking);

            // เรียงลำดับตามวันที่และเวลาอัตโนมัติ
            bookings.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

            localStorage.setItem('meetings_presentation_oct_v5', JSON.stringify(bookings));

            bookingForm.reset();
            dateInput.classList.add('text-gray-400');
            renderBookings();
        });

        window.deleteBooking = function(index) {
            bookings.splice(index, 1);
            localStorage.setItem('meetings_presentation_oct_v5', JSON.stringify(bookings));
            renderBookings();
        }

        clearAllBtn.addEventListener('click', function() {
            if (confirm('คุณต้องการลบรายการนัดหมายทั้งหมดใช่หรือไม่?')) {
                bookings = [];
                localStorage.removeItem('meetings_presentation_oct_v5');
                renderBookings();
            }
        });

        renderBookings();
    </script>
</body>
</html>
